name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.8.2"
  TASK_VERSION: "3.38.0"

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────
      # Python & Poetry Setup with Caching
      # ─────────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry installation
        id: cache-poetry
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-${{ env.POETRY_VERSION }}-${{ runner.os }}

      - name: Install Poetry
        if: steps.cache-poetry.outputs.cache-hit != 'true'
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Configure Poetry path
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Poetry dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      # ─────────────────────────────────────────────────────────────
      # Task (go-task) Setup with Caching
      # ─────────────────────────────────────────────────────────────
      - name: Cache Task installation
        id: cache-task
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/task
          key: task-${{ env.TASK_VERSION }}-${{ runner.os }}

      - name: Install Task
        if: steps.cache-task.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz" | tar xz -C ~/.local/bin task
          chmod +x ~/.local/bin/task

      - name: Add Task to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ─────────────────────────────────────────────────────────────
      # Quality Checks
      # ─────────────────────────────────────────────────────────────
      - name: Run linting
        id: lint
        run: poetry run task lint

      - name: Run format check
        id: format
        run: poetry run task format:check

      - name: Run type checking
        id: typecheck
        run: poetry run task typecheck

      - name: Run tests
        id: test
        run: poetry run task test

      - name: Run coverage
        id: coverage
        run: poetry run task coverage
        continue-on-error: true
